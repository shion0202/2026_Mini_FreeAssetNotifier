# GitHub Actions에게 리포지토리 쓰기 권한을 부여합니다 (캐시 파일 업데이트용)
permissions:
  contents: write

name: Daily Asset Update Check

on:
  schedule:
    # 매일 한국 시간(KST) 오전 9시에 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 변경사항을 다시 Push하기 위해 전체 히스토리를 가져옵니다.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install DrissionPage

      - name: Create Config File from Secrets
        shell: bash
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          echo "${{ secrets.DISCORD_BOT_TOKEN }}" > config.txt
          echo "${{ secrets.DISCORD_CHANNEL_ID }}" >> config.txt

      # C++ 빌드를 위한 MSVC 환경 활성화
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C++ Application
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          # /utf-8 옵션으로 한글 깨짐 방지
          cl.exe /EHsc /std:c++17 /utf-8 FreeAssetNotifier.cpp /Fe:asset_checker.exe

      - name: Run Application
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          ./asset_checker.exe

      - name: Commit and Push Changes
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 캐시 파일이 실제로 생성/변경되었는지 확인 후 스테이징
          git add last_unity.txt last_fab.txt
          
          # 변경사항이 있는 경우에만 커밋 및 푸시 진행
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update asset cache [skip ci]" && git push)