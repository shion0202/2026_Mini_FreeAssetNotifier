# GitHub Actions에게 리포지토리 쓰기 권한을 부여합니다.
permissions:
  contents: write

name: Daily Asset Update Check

on:
  schedule:
    # 매일 한국 시간(KST) 오전 9시에 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install DrissionPage

      # [수정] config.txt 생성 및 경로 확인 강화
      - name: Create Config File from Secrets
        shell: bash
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          # 봇 토큰과 채널 ID를 config.txt에 저장
          echo "${{ secrets.DISCORD_BOT_TOKEN }}" > config.txt
          echo "${{ secrets.DISCORD_CHANNEL_ID }}" >> config.txt
          
          # [디버깅] 파일이 잘 생성되었는지 크기 확인
          echo "Checking config.txt in current directory..."
          ls -l config.txt
          
          # 혹시 모를 경로 오류를 대비해 상위 폴더에도 복사
          cp config.txt ../../config.txt

      # C++ 빌드를 위한 MSVC 환경 활성화
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C++ Application
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          # /utf-8 옵션으로 한글 깨짐 방지
          cl.exe /EHsc /std:c++17 /utf-8 FreeAssetNotifier.cpp /Fe:asset_checker.exe

      # [수정] 실행 전 파일 존재 여부 최종 확인
      - name: Run Application
        shell: bash
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          echo "Current Path: $(pwd)"
          if [ -f "config.txt" ]; then 
            echo "Config file found! Running application..."
          else 
            echo "CRITICAL: Config file MISSING!"
          fi
          ./asset_checker.exe

      - name: Commit and Push Changes
        shell: bash
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 캐시 파일 강제 추가 (gitignore 무시)
          git add -f last_unity.txt last_fab.txt 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "No changes detected in cache files. Skipping push."
          else
            git commit -m "chore: update asset cache [skip ci]"
            git push origin main
            echo "Successfully pushed changes to repository."
          fi