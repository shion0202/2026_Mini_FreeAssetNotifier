name: Daily Asset Update Check

on:
  schedule:
    # 매일 한국 시간(KST) 오전 9시에 실행 (UTC 기준 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동으로도 실행 가능하게 설정

jobs:
  build-and-run:
    runs-on: windows-latest # C++(MSVC)와 브라우저 환경을 위해 윈도우 사용

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install DrissionPage

      - name: Create Config File from Secrets
        shell: bash
        run: |
          echo "${{ secrets.DISCORD_BOT_TOKEN }}" > config.txt
          echo "${{ secrets.DISCORD_CHANNEL_ID }}" >> config.txt

      - name: Build C++ Application
        run: |
          # nlohmann/json이 프로젝트 폴더 내에 있다고 가정 (헤더파일 경로 확인 필요)
          cl.exe /EHsc /std:c++17 main.cpp /Fe:asset_checker.exe

      - name: Run Application
        run: |
          ./asset_checker.exe

      - name: Commit and Push Changes (Cache update)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_unity.txt last_fab.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update asset cache" && git push)