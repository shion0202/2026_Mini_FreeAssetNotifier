permissions:
  contents: write

name: Daily Asset Update Check

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install DrissionPage

      - name: Create Config File from Secrets
        shell: bash
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          echo "${{ secrets.DISCORD_BOT_TOKEN }}" > config.txt
          echo "${{ secrets.DISCORD_CHANNEL_ID }}" >> config.txt

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C++ Application
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          cl.exe /EHsc /std:c++17 /utf-8 FreeAssetNotifier.cpp /Fe:asset_checker.exe

      - name: Run Application
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          ./asset_checker.exe

      - name: Commit and Push Changes
        run: |
          # 루트가 아닌 파일이 실제 위치한 곳에서 작업
          cd FreeAssetNotifier/FreeAssetNotifier
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 파일 추가 (존재하지 않을 경우를 대비해 에러 무시)
          git add last_unity.txt last_fab.txt 2>/dev/null || true
          
          # 변경 사항 확인 후 커밋
          # 'nothing to commit' 에러를 방지하기 위해 if 문 사용
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update asset cache [skip ci]"
            git push origin main
            echo "Changes pushed to repository."
          else
            echo "No changes detected. Skipping push."
          fi
        shell: bash