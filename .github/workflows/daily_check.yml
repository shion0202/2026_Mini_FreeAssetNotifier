# GitHub Actions에게 리포지토리 쓰기 권한을 부여합니다.
permissions:
  contents: write

name: Daily Asset Update Check

on:
  schedule:
    # 매일 한국 시간(KST) 오전 9시에 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install DrissionPage

      - name: Create Config File from Secrets
        shell: bash
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          echo "${{ secrets.DISCORD_BOT_TOKEN }}" > config.txt
          echo "${{ secrets.DISCORD_CHANNEL_ID }}" >> config.txt

      # C++ 빌드를 위한 MSVC 환경 활성화
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C++ Application
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          # /utf-8 옵션으로 한글 깨짐 방지
          cl.exe /EHsc /std:c++17 /utf-8 FreeAssetNotifier.cpp /Fe:asset_checker.exe

      - name: Run Application
        run: |
          cd FreeAssetNotifier/FreeAssetNotifier
          ./asset_checker.exe

      - name: Commit and Push Changes
        shell: bash
        run: |
          # 1. 파일이 위치한 폴더로 이동
          cd FreeAssetNotifier/FreeAssetNotifier
          
          # 2. Git 유저 설정
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. [디버깅] 현재 폴더에 어떤 파일들이 있는지 출력 (로그에서 확인 가능)
          echo "--- Current Directory File List ---"
          ls -R
          echo "-----------------------------------"
          
          # 4. 파일이 존재할 때만 git add 수행
          if [ -f "last_unity.txt" ]; then 
            git add last_unity.txt
            echo "Added last_unity.txt to staging."
          fi
          
          if [ -f "last_fab.txt" ]; then 
            git add last_fab.txt
            echo "Added last_fab.txt to staging."
          fi
          
          # 5. 스테이징된 변경 사항이 있는지 확인 후 커밋/푸시
          # git diff --cached --quiet는 변경사항이 없으면 0을 반환함
          if git diff --cached --quiet; then
            echo "No changes detected in cache files. Skipping push."
          else
            git commit -m "chore: update asset cache [skip ci]"
            git push origin main
            echo "Successfully pushed changes to repository."
          fi